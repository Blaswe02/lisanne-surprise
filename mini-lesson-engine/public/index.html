<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESL Mini-Lesson Generator</title>
  <style>
    :root {
      --primary:    #2563eb;
      --primary-h:  #1d4ed8;
      --success:    #16a34a;
      --error:      #dc2626;
      --bg:         #f1f5f9;
      --surface:    #ffffff;
      --border:     #e2e8f0;
      --text:       #1e293b;
      --muted:      #64748b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    header {
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 10px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    .chip {
      background: var(--primary);
      color: #fff;
      font-size: 0.67rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── layout ── */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* ── left panel ── */
    .panel {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
    }
    .field { margin-bottom: 13px; }
    label {
      display: block;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    input[type=text], textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.88rem;
      font-family: inherit;
      color: var(--text);
      transition: border-color .15s, box-shadow .15s;
      resize: vertical;
    }
    input[type=text]:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    /* ── footer ── */
    .panel-foot {
      padding: 11px 16px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .status-bar {
      font-size: 0.81rem;
      padding: 5px 9px;
      border-radius: 5px;
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .s-idle    { color: var(--muted); }
    .s-loading { color: var(--primary); background: rgba(37,99,235,.08); }
    .s-done    { color: var(--success); background: rgba(22,163,74,.08); }
    .s-error   { color: var(--error);   background: rgba(220,38,38,.08); }

    .spinner {
      width: 13px; height: 13px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 0.87rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn-primary  { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled)  { background: var(--primary-h); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg); }
    button:disabled { opacity: .42; cursor: not-allowed; }

    /* ── right: preview ── */
    .preview-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-head {
      height: 44px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 10px;
    }
    .preview-label {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* ── style switcher ── */
    .style-row {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .style-btn {
      padding: 4px 11px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .style-btn:hover { border-color: var(--primary); color: var(--primary); }
    .style-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }
    .style-btn:disabled { opacity: .4; cursor: not-allowed; }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: #fff;
      display: none;
    }
    .placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 14px;
      padding: 40px;
    }
    .placeholder svg { opacity: .2; }
    .placeholder p { font-size: 0.87rem; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>

<header>
  <h1>ESL Mini-Lesson Generator</h1>
  <span class="chip">Level 0</span>
</header>

<div class="layout">

  <div class="panel">
    <div class="panel-body">
      <div class="field">
        <label for="headline">Headline</label>
        <input type="text" id="headline"
          placeholder="e.g. City bans cars from downtown on weekends" />
      </div>
      <div class="field">
        <label for="article">Article text</label>
        <textarea id="article" rows="12"
          placeholder="Paste the full news article here…"></textarea>
      </div>
      <div class="field">
        <label for="sources">Sources
          <span style="font-weight:400;text-transform:none">(optional, one URL per line)</span>
        </label>
        <textarea id="sources" rows="2"
          placeholder="https://example.com/article"></textarea>
      </div>
    </div>

    <div class="panel-foot">
      <div class="status-bar s-idle" id="status">
        Ready. Fill in headline + article, then click Generate.
      </div>
      <button class="btn-primary" id="generateBtn">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.3">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Generate Level 0 Lesson
      </button>
      <button class="btn-secondary" id="downloadBtn" disabled>
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.3">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Download PDF
      </button>
    </div>
  </div>

  <div class="preview-area">
    <div class="preview-head">
      <span class="preview-label">Preview</span>
      <div class="style-row" id="styleRow">
        <!-- populated by JS from /api/themes -->
      </div>
    </div>

    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <p>Your printable lesson preview appears here.<br>Fill in the form and click Generate.</p>
    </div>

    <iframe id="preview" title="Lesson preview"></iframe>
  </div>

</div>

<script>
  const headlineEl  = document.getElementById('headline');
  const articleEl   = document.getElementById('article');
  const sourcesEl   = document.getElementById('sources');
  const generateBtn = document.getElementById('generateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusEl    = document.getElementById('status');
  const previewEl   = document.getElementById('preview');
  const placeholderEl = document.getElementById('placeholder');
  const styleRow    = document.getElementById('styleRow');

  let lastHtml     = null;
  let lastData     = null;   // raw lesson data (no html) for re-render
  let lastHeadline = '';
  let lastSources  = [];
  let activeStyle  = 'classic';

  // ── status ─────────────────────────────────────────────────────────────────
  function setStatus(msg, type, spinner = false) {
    statusEl.className = `status-bar s-${type}`;
    statusEl.innerHTML = spinner ? `<span class="spinner"></span>${msg}` : msg;
  }

  // ── build style buttons ────────────────────────────────────────────────────
  fetch('/api/themes')
    .then(r => r.json())
    .then(themes => {
      themes.forEach(({ id, label }) => {
        const btn = document.createElement('button');
        btn.className = 'style-btn' + (id === 'classic' ? ' active' : '');
        btn.textContent = label;
        btn.dataset.style = id;
        btn.disabled = true;
        btn.addEventListener('click', () => switchStyle(id));
        styleRow.appendChild(btn);
      });
    })
    .catch(() => {});

  function setActiveStyleBtn(id) {
    styleRow.querySelectorAll('.style-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.style === id);
    });
  }

  function enableStyleBtns(on) {
    styleRow.querySelectorAll('.style-btn').forEach(b => { b.disabled = !on; });
  }

  // ── switch style (no AI call) ──────────────────────────────────────────────
  async function switchStyle(style) {
    if (!lastData || style === activeStyle) return;

    enableStyleBtns(false);
    setStatus('Switching style…', 'loading', true);

    try {
      const res  = await fetch('/api/render', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          headline: lastHeadline,
          sources:  lastSources,
          data:     lastData,
          style,
        }),
      });
      const json = await res.json();
      if (!res.ok || json.error) throw new Error(json.error || `HTTP ${res.status}`);

      lastHtml    = json.html;
      activeStyle = style;
      previewEl.srcdoc = lastHtml;
      setActiveStyleBtn(style);
      setStatus('Style applied.', 'done');
    } catch (err) {
      setStatus(`Style error: ${err.message}`, 'error');
    } finally {
      enableStyleBtns(true);
    }
  }

  // ── generate ───────────────────────────────────────────────────────────────
  generateBtn.addEventListener('click', async () => {
    const headline = headlineEl.value.trim();
    const article  = articleEl.value.trim();
    if (!headline) { setStatus('Please enter a headline.', 'error'); return; }
    if (!article)  { setStatus('Please paste the article text.', 'error'); return; }

    const sources = sourcesEl.value.split('\n').map(s => s.trim()).filter(Boolean);

    generateBtn.disabled = true;
    downloadBtn.disabled = true;
    enableStyleBtns(false);
    setStatus('Generating lesson… 20–40 s', 'loading', true);
    lastData = null; lastHtml = null;

    try {
      const res  = await fetch('/api/generate-level0', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ headline, article, sources, style: activeStyle }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

      // store data without html for re-render
      const { html, ...lessonData } = data;
      lastData     = lessonData;
      lastHtml     = html;
      lastHeadline = headline;
      lastSources  = sources;

      placeholderEl.style.display = 'none';
      previewEl.style.display     = 'block';
      previewEl.srcdoc            = lastHtml;

      downloadBtn.disabled = false;
      enableStyleBtns(true);
      setStatus('Lesson generated!', 'done');
    } catch (err) {
      setStatus(`Error: ${err.message}`, 'error');
    } finally {
      generateBtn.disabled = false;
    }
  });

  // ── download PDF ───────────────────────────────────────────────────────────
  downloadBtn.addEventListener('click', async () => {
    if (!lastHtml) return;
    downloadBtn.disabled = true;
    setStatus('Generating PDF…', 'loading', true);

    try {
      const res = await fetch('/api/pdf', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ html: lastHtml }),
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        throw new Error(e.error || `HTTP ${res.status}`);
      }
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), {
        href: url, download: `lesson-level0-${activeStyle}.pdf`,
      });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus('PDF downloaded!', 'done');
    } catch (err) {
      setStatus(`PDF error: ${err.message}`, 'error');
    } finally {
      downloadBtn.disabled = false;
    }
  });

  // Ctrl/Cmd+Enter shortcut
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !generateBtn.disabled)
      generateBtn.click();
  });
</script>

</body>
</html>
