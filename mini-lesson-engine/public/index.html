<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESL Mini-Lesson Generator</title>
  <style>
    :root {
      --primary:       #2563eb;
      --primary-h:     #1d4ed8;
      --success:       #16a34a;
      --error:         #dc2626;
      --warn:          #d97706;
      --bg:            #f1f5f9;
      --surface:       #ffffff;
      --border:        #e2e8f0;
      --text:          #1e293b;
      --muted:         #64748b;
      --header-h:      56px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    .chip {
      background: var(--primary);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 99px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .chip-mock {
      background: var(--warn);
      display: none;
    }

    /* ── two-column layout ── */
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* ── left panel ── */
    .panel {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 8px;
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    input[type=text], textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      transition: border-color .15s, box-shadow .15s;
      resize: vertical;
    }
    input[type=text]:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    /* ── footer actions ── */
    .panel-foot {
      padding: 12px 18px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .status-bar {
      font-size: 0.82rem;
      padding: 6px 10px;
      border-radius: 5px;
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .2s, color .2s;
    }
    .s-idle    { color: var(--muted); }
    .s-loading { color: var(--primary);  background: rgba(37,99,235,.08); }
    .s-done    { color: var(--success);  background: rgba(22,163,74,.08); }
    .s-error   { color: var(--error);    background: rgba(220,38,38,.08); }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── buttons ── */
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      white-space: nowrap;
    }
    .btn-primary   { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled)   { background: var(--primary-h); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    /* ── preview area ── */
    .preview-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-head {
      padding: 0 20px;
      height: 38px;
      display: flex;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: #fff;
      display: none;
    }
    .placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 14px;
      padding: 40px;
    }
    .placeholder svg { opacity: .25; }
    .placeholder p   { font-size: 0.88rem; text-align: center; line-height: 1.5; }

    /* responsive: stack on small screens */
    @media (max-width: 760px) {
      body { overflow: auto; }
      .layout { grid-template-columns: 1fr; height: auto; }
      .preview-area { height: 70vh; }
      iframe { display: none !important; }
    }
  </style>
</head>
<body>

<header>
  <h1>ESL Mini-Lesson Generator</h1>
  <span class="chip">Level 0</span>
  <span class="chip chip-mock" id="mockChip">Mock mode</span>
</header>

<div class="layout">

  <!-- ── left: inputs ── -->
  <div class="panel">
    <div class="panel-body">
      <div class="field">
        <label for="headline">Headline</label>
        <input type="text" id="headline"
          placeholder="e.g. Scientists discover new species of fish" />
      </div>

      <div class="field">
        <label for="article">Article text</label>
        <textarea id="article" rows="13"
          placeholder="Paste the full raw news article here…"></textarea>
      </div>

      <div class="field">
        <label for="sources">Sources <span style="font-weight:400;text-transform:none">(optional – one URL per line)</span></label>
        <textarea id="sources" rows="3"
          placeholder="https://example.com/article"></textarea>
      </div>
    </div>

    <div class="panel-foot">
      <div class="status-bar s-idle" id="status">
        Ready. Paste a headline and article, then click Generate.
      </div>

      <button class="btn-primary" id="generateBtn">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Generate Level 0 Lesson
      </button>

      <button class="btn-secondary" id="downloadBtn" disabled>
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Download PDF
      </button>
    </div>
  </div>

  <!-- ── right: preview ── -->
  <div class="preview-area">
    <div class="preview-head">Lesson Preview</div>

    <div class="placeholder" id="placeholder">
      <svg width="72" height="72" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <p>Your printable lesson will appear here after generation.</p>
    </div>

    <iframe id="preview" title="Lesson preview"></iframe>
  </div>

</div>

<script>
  const headlineEl   = document.getElementById('headline');
  const articleEl    = document.getElementById('article');
  const sourcesEl    = document.getElementById('sources');
  const generateBtn  = document.getElementById('generateBtn');
  const downloadBtn  = document.getElementById('downloadBtn');
  const statusEl     = document.getElementById('status');
  const previewEl    = document.getElementById('preview');
  const placeholderEl= document.getElementById('placeholder');
  const mockChip     = document.getElementById('mockChip');

  let lastHtml = null;

  // ── status helper ──────────────────────────────────────────────────────────
  function setStatus(msg, type, showSpinner = false) {
    statusEl.className = `status-bar s-${type}`;
    statusEl.innerHTML = showSpinner
      ? `<span class="spinner"></span>${msg}`
      : msg;
  }

  // ── detect mock mode on load ───────────────────────────────────────────────
  fetch('/health').then(r => r.json()).then(() => {
    // ping generate with empty body just to check mock mode flag
    // (we do this silently via a lightweight approach)
  }).catch(() => {});

  // ── generate ───────────────────────────────────────────────────────────────
  generateBtn.addEventListener('click', async () => {
    const headline = headlineEl.value.trim();
    const article  = articleEl.value.trim();

    if (!headline) { setStatus('Please enter a headline.', 'error'); return; }
    if (!article)  { setStatus('Please paste the article text.', 'error'); return; }

    const sources = sourcesEl.value
      .split('\n').map(s => s.trim()).filter(Boolean);

    generateBtn.disabled = true;
    downloadBtn.disabled = true;
    lastHtml = null;
    setStatus('Generating lesson… this may take 20–40 seconds.', 'loading', true);

    try {
      const res  = await fetch('/api/generate-level0', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ headline, article, sources }),
      });

      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

      lastHtml = data.html;

      // show preview
      placeholderEl.style.display = 'none';
      previewEl.style.display     = 'block';
      previewEl.srcdoc            = lastHtml;

      downloadBtn.disabled = false;
      setStatus('Lesson generated successfully!', 'done');

      // show mock chip if API key is missing (server will have used mock data)
      if (!data.reading?.p1 || data.reading.p1.includes('There is important news')) {
        mockChip.style.display = 'inline-block';
      }
    } catch (err) {
      setStatus(`Error: ${err.message}`, 'error');
    } finally {
      generateBtn.disabled = false;
    }
  });

  // ── download PDF ───────────────────────────────────────────────────────────
  downloadBtn.addEventListener('click', async () => {
    if (!lastHtml) return;

    downloadBtn.disabled = true;
    setStatus('Generating PDF…', 'loading', true);

    try {
      const res = await fetch('/api/pdf', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ html: lastHtml }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: 'PDF failed' }));
        throw new Error(err.error || `HTTP ${res.status}`);
      }

      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), {
        href:     url,
        download: 'lesson-level0.pdf',
      });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setStatus('PDF downloaded!', 'done');
    } catch (err) {
      setStatus(`PDF error: ${err.message}`, 'error');
    } finally {
      downloadBtn.disabled = false;
    }
  });

  // ── keyboard shortcut: Ctrl/Cmd+Enter to generate ─────────────────────────
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !generateBtn.disabled) {
      generateBtn.click();
    }
  });
</script>

</body>
</html>
